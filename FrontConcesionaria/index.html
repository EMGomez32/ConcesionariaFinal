<!doctype html>
<!-- El tema se fija ANTES del primer paint con el script de abajo (sin flash):
     lee la elección persistida (store `autenza-theme`) y cae a OSCURO por defecto
     (la app es dark-first; el claro es opt-in vía el toggle del TopBar). El CSS
     resuelve los tokens con :root (claro) y [data-theme="dark"] (oscuro). -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Aplica el tema guardado antes de pintar, para que no haya flash de tema.
      (function () {
        try {
          var raw = localStorage.getItem('autenza-theme');
          var t = raw && (JSON.parse(raw).state || {}).theme;
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <meta name="color-scheme" content="light dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
    />

    <!--
      Metadatos de previsualización, ESTÁTICOS a propósito.

      /capacitacion es pública y se manda por WhatsApp. El crawler de Meta no
      ejecuta JavaScript: pide la URL y lee el HTML que devuelve nginx, que para
      cualquier ruta del SPA es este mismo archivo. Todo lo que React inyecte en
      el <head> después de montar llega tarde para la tarjeta del link, así que
      los og:* tienen que vivir acá. Como este index.html se sirve para TODAS las
      rutas, el texto describe el producto y no una página en particular: es
      cierto tanto para /capacitacion como para /login.

      og:image apunta al isotipo cuadrado que ya está en public/. WhatsApp lo
      renderiza como miniatura al costado del título; no hay todavía una pieza
      1200x630 en marca-autenza/ y no se inventa una acá.
    -->
    <meta
      name="description"
      content="AUTENZA es el sistema de gestión para concesionarias de autos: stock, consultas, reservas, ventas, cobranzas, postventa y documentación en un solo lugar, con el margen real de cada unidad."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AUTENZA" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="AUTENZA — Sistema de gestión para concesionarias" />
    <meta
      property="og:description"
      content="Stock, consultas, reservas, ventas, cobranzas y postventa en un solo lugar, con el margen real de cada auto. Adentro: la presentación y la capacitación de cada rol."
    />
    <meta property="og:image" content="https://autenza.nebulant.com.ar/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Isotipo de AUTENZA" />
    <meta name="twitter:card" content="summary" />

    <title>AUTENZA · Concesionaria</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

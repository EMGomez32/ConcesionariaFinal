# nginx.conf custom para el frontend (SPA Vite + security headers)
# Versión "dev-friendly": HSTS sin preload, CSP que tolera el bundle de Vite,
# bloqueo de features del browser no usadas.
#
# Este archivo se incluye DENTRO del bloque http del nginx.conf de la imagen
# (/etc/nginx/conf.d/default.conf), por eso los map y el log_format van acá afuera.

# ─── Access log sin query string ──────────────────────────────────────────────
# El formato por defecto ("main") loguea "$request" entero, con la query: ahí viajan
# la firma de los adjuntos privados (/uploads/...?exp=&sig=), el token de reseteo de
# contraseña (/reset-password?token=) y filtros de búsqueda con nombres, DNI o
# teléfonos. Un log no tiene que ser un lugar donde se pueda levantar un enlace válido
# ni PII. Se loguea la ruta ORIGINAL ($request_uri sin lo que sigue al "?"; $uri no
# sirve porque después del try_files del SPA vale /index.html) y el Referer recortado
# igual: con Referrer-Policy strict-origin-when-cross-origin, el navegador manda la URL
# completa (con su query) en los pedidos same-origin.
map $request_uri $ruta_sin_query {
    "~^(?<ruta>[^?]*)" $ruta;
    default            "-";
}
map $http_referer $referer_sin_query {
    "~^(?<ref>[^?]*)" $ref;
    default           "-";
}
# $remote_addr es el cloudflared/bridge de docker (siempre la misma IP); la del
# visitante la trae Cloudflare en CF-Connecting-IP. Sirve para investigar abusos.
log_format sin_query '$remote_addr cf=$http_cf_connecting_ip [$time_local] '
                     '"$request_method $ruta_sin_query $server_protocol" $status $body_bytes_sent '
                     '"$referer_sin_query" "$http_user_agent" rt=$request_time urt=$upstream_response_time';

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log sin_query;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers ─────────────────────────────────────────────────────

    # Forzar HTTPS futuro: 1 año, incluir subdominios. Sin preload para no
    # quedar atado al registro global de browsers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # No permitir embed en iframes de otros dominios (anti-clickjacking).
    add_header X-Frame-Options "SAMEORIGIN" always;

    # No sniff de MIME types — un .txt no se ejecuta como JS aunque parezca.
    add_header X-Content-Type-Options "nosniff" always;

    # No leak del path completo a otros dominios al hacer click en links externos.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bloquear features que la app no necesita.
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # CSP — permisiva, compatible con Vite/React (que inyecta styles inline).
    # La API y los uploads se sirven same-origin vía proxy (/api, /uploads),
    # así que alcanza con 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Aislamiento del browser.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # nginx NO hereda add_header del server cuando el location tiene los suyos,
    # así que repetimos TODA la lista de security headers en cada location que
    # los necesite.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    # Assets versionados de Vite — cache largo (su nombre incluye hash).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    # Proxy al backend — mismo origen para el browser, así no hay CORS ni
    # hace falta exponer el puerto 3000 en el tunnel. "backend" resuelve por
    # el DNS interno de docker compose.
    #
    # Cabeceras de seguridad: las pone nginx (heredadas del server) y NO las del
    # backend. helmet también setea estas mismas, y sin esto el navegador recibía
    # dos CSP, dos HSTS, dos X-Frame-Options... y dos Cross-Origin-Resource-Policy
    # que se CONTRADECÍAN (helmet `cross-origin`, nginx `same-site`; con dos valores
    # el navegador descarta el header y queda como si no hubiera política). El front
    # consume la API same-origin, así que `same-site` no rompe nada. helmet sigue
    # protegiendo al backend si se lo llama directo (tests, red interna); las que
    # nginx no pone (Origin-Agent-Cluster, X-Permitted-Cross-Domain-Policies, etc.)
    # pasan tal cual porque no se duplican.
    location /api/ {
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # IP real del visitante detrás del Cloudflare Tunnel. La app la prioriza
        # para auditoría y rate limiting; explícito para no depender del passthrough.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # Archivos subidos (fotos/documentos) que sirve el backend.
    #
    # Mismo problema de duplicados que /api/, con una diferencia: acá la CSP que
    # vale es la del BACKEND (`default-src 'none'; sandbox`, uploads.middleware.ts),
    # que aísla un HTML/SVG malicioso subido como adjunto; la del SPA es mucho más
    # permisiva. Por eso esta location declara sus propios add_header SIN CSP ni
    # nosniff (así no hereda los del server) y deja pasar esos dos del backend; el
    # resto lo pone nginx y se esconde la copia de helmet. CORP `same-site`: los
    # adjuntos (DNI, recibos) no se pueden incrustar desde otros sitios; la SPA y
    # la app nativa (que no aplica CORP) no se ven afectadas.
    location /uploads/ {
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — toda ruta desconocida cae a index.html para que React
    # Router maneje el routing client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Esconder versión de nginx en headers/error pages.
    server_tokens off;

    # Tamaño máximo de upload coherente con multer del backend (25 MB).
    client_max_body_size 25m;
}

name: CI

# Corre en cada push y pull request. Compila y typechequea backend, frontend y la
# app móvil, y corre los tests (unit + integración + verificación de RLS del back;
# lint + vitest del front; scripts de operación) ANTES de que el código llegue a la
# Raspberry — caza errores de TypeScript, builds rotos y regresiones de
# comportamiento (aislamiento multi-tenant, RBAC, state machines). Además frena
# dependencias de runtime con vulnerabilidades altas (npm audit) y secretos
# commiteados por error (gitleaks). El análisis estático (CodeQL) está en codeql.yml.
on:
  push:
  pull_request:

# Mínimo privilegio: ningún job necesita más que LEER el repo (checkout + build + tests). Sin esto
# el GITHUB_TOKEN queda con los permisos por defecto del repo/organización, que pueden incluir
# escritura (contenido, PRs, paquetes): un paso comprometido de una acción de terceros podría usarla.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    env:
      # Dummy: prisma generate lee el datasource del schema pero NO se conecta.
      # El build (tsc) no toca la base. La validación de env (zod) es en runtime.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=disable
    defaults:
      run:
        working-directory: BackConcesionaria
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: BackConcesionaria/package-lock.json
      - run: npm ci
      - name: Generar cliente Prisma
        run: npx prisma generate
      - name: Typecheck + build (tsc)
        run: npm run build
      # Unit tests PUROS (dominio: cobro de cuota). No necesitan DB ni server.
      - name: Unit tests
        run: npm run test:unit

  integration:
    name: Backend (integration tests)
    runs-on: ubuntu-latest
    # Postgres descartable para la corrida. Los tests pegan por HTTP al backend
    # levantado contra esta base (no se mockea Prisma: se valida RLS, triggers,
    # soft-delete, state machines, aislamiento multi-tenant reales).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpg
          POSTGRES_DB: concesionaria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d concesionaria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpg@localhost:5432/concesionaria_test?sslmode=disable
      JWT_SECRET: test_jwt_secret_ci_1234567890_abcdef
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_ci_0987654321_zyxwv
      # NODE_ENV=test es CRÍTICO: los rate limiters (apiLimiter/loginLimiter) sólo
      # se saltean en test; si no, las corridas repetidas pegan 429 y flakean.
      NODE_ENV: test
      PORT: '3000'
      LOG_LEVEL: warn
      API_BASE_URL: http://localhost:3000
    defaults:
      run:
        working-directory: BackConcesionaria
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: BackConcesionaria/package-lock.json
      - run: npm ci
      - name: Generar cliente Prisma
        run: npx prisma generate
      - name: Aplicar schema (migrate deploy)
        run: npx prisma migrate deploy
      # Drift guard SIN shadow DB (evita el footgun de --from-migrations, que Prisma
      # RESETEA la DB apuntada): compara el schema.prisma contra la DB ya migrada por
      # migrate deploy. exit 2 si el schema cambió sin una migración que lo acompañe.
      - name: Drift guard (schema.prisma cubierto por las migraciones)
        run: npx prisma migrate diff --from-schema prisma/schema.prisma --to-config-datasource --exit-code
      - name: Inicializar RLS (policies + triggers)
        run: npm run init-rls
      - name: Seed de CI (roles, plan, tenant, usuarios demo)
        run: npm run seed-ci
      - name: Build
        run: npm run build
      - name: Levantar backend + correr integración
        run: |
          node dist/server.js > /tmp/server.log 2>&1 &
          SRVPID=$!
          echo "esperando /health (PID $SRVPID)..."
          for i in $(seq 1 30); do
            curl -sf -m 2 http://localhost:3000/health >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -sf -m 2 http://localhost:3000/health >/dev/null 2>&1; then
            echo "::error::el backend no respondió a /health"; cat /tmp/server.log; kill $SRVPID 2>/dev/null; exit 1
          fi
          echo "backend healthy; corriendo suites de integración..."
          set +e
          npm run test:integration
          CODE=$?
          set -e
          kill $SRVPID 2>/dev/null || true
          if [ $CODE -ne 0 ]; then echo "=== server.log ==="; cat /tmp/server.log; fi
          exit $CODE

  integration-rls:
    name: Backend (integration bajo app_rw / RLS)
    runs-on: ubuntu-latest
    # Igual que 'integration' pero el backend corre como el rol NO-superusuario
    # app_rw (APP_DATABASE_URL) → la RLS de Postgres FILTRA de verdad. Garantiza que
    # la app funciona bajo RLS (la config OBJETIVO del cutover), no sólo como
    # superusuario. Caza cualquier camino cross-tenant sin bypass que rompería la
    # app apenas se active app_rw en prod.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpg
          POSTGRES_DB: concesionaria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d concesionaria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Admin (superusuario): sólo db push / init-rls / setup-app-role / seed.
      DATABASE_URL: postgresql://postgres:testpg@localhost:5432/concesionaria_test?sslmode=disable
      # Runtime del server: rol NO-superusuario app_rw → la RLS aplica de verdad.
      APP_DB_PASSWORD: app_rw_ci_pw_7h2n
      APP_DATABASE_URL: postgresql://app_rw:app_rw_ci_pw_7h2n@localhost:5432/concesionaria_test?sslmode=disable
      JWT_SECRET: test_jwt_secret_ci_1234567890_abcdef
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_ci_0987654321_zyxwv
      NODE_ENV: test
      PORT: '3000'
      LOG_LEVEL: warn
      API_BASE_URL: http://localhost:3000
    defaults:
      run:
        working-directory: BackConcesionaria
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: BackConcesionaria/package-lock.json
      - run: npm ci
      - name: Generar cliente Prisma
        run: npx prisma generate
      - name: Aplicar schema (migrate deploy)
        run: npx prisma migrate deploy
      - name: Inicializar RLS (policies + triggers)
        run: npm run init-rls
      - name: Crear rol app_rw + grants
        run: npm run setup-app-role
      - name: Seed de CI (roles, plan, tenant, usuarios demo)
        run: npm run seed-ci
      - name: Build
        run: npm run build
      - name: Levantar backend (app_rw) + correr integración
        run: |
          node dist/server.js > /tmp/server.log 2>&1 &
          SRVPID=$!
          echo "esperando /health (PID $SRVPID, rol app_rw)..."
          for i in $(seq 1 30); do
            curl -sf -m 2 http://localhost:3000/health >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -sf -m 2 http://localhost:3000/health >/dev/null 2>&1; then
            echo "::error::el backend no respondió a /health"; cat /tmp/server.log; kill $SRVPID 2>/dev/null; exit 1
          fi
          echo "backend healthy (app_rw); corriendo suites bajo RLS..."
          set +e
          npm run test:integration
          CODE=$?
          set -e
          kill $SRVPID 2>/dev/null || true
          if [ $CODE -ne 0 ]; then echo "=== server.log ==="; cat /tmp/server.log; fi
          exit $CODE

  rls-verify:
    name: Backend (RLS role verification)
    runs-on: ubuntu-latest
    # Verifica, contra un Postgres descartable propio (levantado por el script vía
    # docker), que la RLS FILTRA de verdad con el rol NO-superusuario app_rw:
    # ve sólo su tenant y WITH CHECK rechaza el INSERT cross-tenant.
    defaults:
      run:
        working-directory: BackConcesionaria
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: BackConcesionaria/package-lock.json
      - run: npm ci
      - name: Generar cliente Prisma
        run: npx prisma generate
      - name: Verificar RLS con rol app_rw
        # El script hace su propio `cd` a la raíz y levanta/baja su contenedor.
        run: bash ../scripts/verify-rls-role.sh

  backup-script:
    name: Scripts (lógica de backup.sh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Prueba la lógica de scripts/backup.sh con pg_dump/age/rclone simulados:
    # cifrado, que nunca se suba nada en claro al offsite, alertas, retención y
    # permisos. No reemplaza al simulacro de restore real (scripts/restore-drill.sh).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh scripts/tests/backup.test.sh

  frontend:
    # El nombre NO se cambia aunque ahora también corre lint y tests: es un check
    # requerido por la protección de main y GitHub lo identifica por este texto.
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontConcesionaria
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: FrontConcesionaria/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck + build (tsc + vite build)
        run: npm run build
      # Tests de componentes y utilidades (vitest + jsdom). Antes existían pero el CI
      # no los corría, así que no protegían nada.
      - name: Tests (vitest)
        run: npx vitest run

  app:
    name: App móvil (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AppConcesionaria
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: AppConcesionaria/package-lock.json
      - run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

  audit:
    name: Dependencias (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `npm audit` sólo necesita el package-lock.json (no instala nada). Mira las
    # dependencias de RUNTIME (--omit=dev): las que llegan a producción.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Bloqueante: una vulnerabilidad alta o crítica en el back o el front rompe el CI.
      # Si aparece una sin arreglo, se decide (actualizar, reemplazar o aceptar el riesgo
      # por escrito); no se apaga el job.
      - name: Backend (bloqueante, alta o crítica)
        working-directory: BackConcesionaria
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend (bloqueante, alta o crítica)
        working-directory: FrontConcesionaria
        run: npm audit --omit=dev --audit-level=high
      # Informativo: lo que queda alto en la app es tooling de Expo (@expo/cli) que sólo
      # se arregla subiendo de SDK. Deja un aviso visible en el resumen del run.
      - name: App móvil (informativo)
        working-directory: AppConcesionaria
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning title=npm audit (app móvil)::Hay vulnerabilidades altas en dependencias de la app (tooling de Expo). No bloquea; se resuelven con la actualización de Expo SDK."
          fi

  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Escanea SÓLO los commits nuevos de este push o PR (el historial viejo se revisó
    # aparte): así un secreto commiteado por error se frena antes del merge a main (el
    # repo es público) sin que los hallazgos históricos bloqueen cada corrida.
    # gitleaks corre desde su imagen oficial fijada por digest (no se baja un binario
    # "latest" en cada corrida). Excepciones acotadas en .gitleaks.toml.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Escanear los commits nuevos
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          HEAD_PR: ${{ github.event.pull_request.head.sha }}
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          set -euo pipefail
          if [ "$EVENTO" = "pull_request" ]; then
            RANGO="${BASE_PR}..${HEAD_PR}"
          elif [ -n "$ANTES" ] && [ -n "${ANTES//0/}" ] && git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            RANGO="${ANTES}..${GITHUB_SHA}"
          else
            # Rama nueva o force-push: todo lo que no está en main.
            RANGO="$(git merge-base origin/main "$GITHUB_SHA")..${GITHUB_SHA}"
          fi
          echo "commits a revisar: ${RANGO} ($(git rev-list --count "$RANGO"))"
          docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --log-opts="--no-merges ${RANGO}" \
            --redact --no-banner --exit-code 1

  scripts-ops:
    name: Scripts (deploy y endurecimiento del host)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Los scripts que el dueño corre a mano en la Pi (scripts/deploy.sh y
    # scripts/hardening/): sintaxis, shellcheck y tests de sus guardas con comandos
    # simulados (no tocan el runner: /etc va a un directorio temporal).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Sintaxis (bash -n)
        run: |
          for f in scripts/deploy.sh scripts/hardening/*.sh scripts/tests/hardening.test.sh scripts/tests/deploy.test.sh; do
            bash -n "$f" && echo "ok $f"
          done
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck --version | head -2
          shellcheck -x scripts/deploy.sh scripts/hardening/*.sh scripts/tests/hardening.test.sh scripts/tests/deploy.test.sh
      - name: Guardas de pi-host-hardening.sh (no dejar al dueño afuera)
        run: bash scripts/tests/hardening.test.sh
      - name: Lógica de deploy.sh (backup previo, rollback, registro)
        run: bash scripts/tests/deploy.test.sh
